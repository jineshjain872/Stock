const CH=["A stock is a small slice of ownership in a company. Companies sell shares to raise money to grow. You buy and sell shares on exchanges like the NYSE or Nasdaq through a broker, and each company has a short ticker code, like AAPL.",

"A bull market is a long rise in prices; a bear market is a long fall. Some companies pay dividends, a share of profit paid to owners, often every quarter. Indexes like the S&P 500 track a basket of companies.",
"Market cap is share price times number of shares. EPS is profit per share. The P/E ratio is price divided by EPS: how much you pay for each $1 of yearly earnings. Companies report these numbers every quarter.",
"Every investment can lose value. Diversification means owning many different investments so one bad pick can't sink you. It can't remove market-wide risk, but it softens it. Higher possible returns usually come with higher risk.",
"Investing a fixed amount on a schedule is called dollar-cost averaging; it smooths the price you pay. ETFs hold many stocks in one fund. Checking prices every hour tempts emotional choices, so think in years and keep an emergency fund in cash.",
"A market order trades right away at the best available price. A limit order trades only at your price or better, so it may never fill. The bid is what buyers offer, the ask is what sellers want, and the gap between them is the spread.",
"Fees such as commissions and fund expense ratios eat into returns over time. Beware promises of guaranteed or risk-free profits, pump-and-dump hype and thinly traded penny stocks. Research a company before you buy.",
"The income statement shows revenue (sales), costs and profit. Gross profit is revenue minus the cost of goods sold. Net income is what remains after all costs and taxes, and EPS is net income divided by shares.",
"The balance sheet lists assets (what a company owns), liabilities (what it owes) and equity (assets minus liabilities). Ratios like debt-to-equity show how much a company relies on borrowing.",
"An index fund copies a market index at low cost. An active fund tries to beat it by picking investments, usually for higher fees, and many lag their index after fees. Mutual funds price once a day; ETFs trade all day.",
"Selling for more than you paid creates a capital gain, which is usually taxed. In many countries holding longer than a year lowers the rate. Retirement accounts give tax breaks. Rules differ by country, so check local rules.",
"P/B compares price to book value per share. The PEG ratio adjusts P/E for expected growth. Free cash flow is the cash left after running costs and investment, a key sign of real strength.",
"Value investors buy stocks trading below their estimated worth; growth investors buy fast-expanding companies that reinvest profits. A value trap looks cheap but stays cheap because the business is struggling.",
"Liquidity is how easily you can trade without moving the price. Thinly traded stocks have wider spreads. A stop-loss order sells if the price falls to a level you choose, but it can't promise a price in a fast crash.",
"Cap-weighted indexes give bigger weight to larger companies. Sectors group firms by industry, like tech or energy. Defensive sectors such as utilities tend to hold up better in downturns.",
"Volatility measures how much prices swing; the standard deviation of returns is one gauge. Beta compares a stock to the market: above 1 means it tends to move more than the market.",

"Bond prices move opposite to interest rates: when rates rise, existing bond prices fall. Higher rates also pressure growth stocks because their future profits are discounted more. A bond's yield is its return relative to its price.",

<div class="tag" style="margin-top:20px">Appearance</div><div class="amts">${['auto','light','dark'].map(t=>`<button class="chip" data-th="${t}" aria-pressed="${S.th==t}">${t[0].toUpperCase()+t.slice(1)}</button>`).join('')}</div>
<div class="tag" style="margin-top:20px">Reset</div><div class="amts"><button class="btn ghost" data-rs="learn">Reset learning progress</button><button class="btn ghost" data-rs="pay">Reset Paper Exchange</button><button class="btn ghost" data-rs="all">Reset everything</button></div><p class="xs2" id="am"></p>`}
$('.logo').insertAdjacentHTML('afterbegin',`<img class="mas sm" src="${WOLF}" alt="">`);
$('#gear').onclick=()=>{renderAc();$('#ac').style.display='flex'};
$('#acx').onclick=()=>{$('#ac').style.display='none';renderLearn();head()};
$('#acb').onclick=async e=>{const t=e.target.closest('button');if(!t)return;
 if(t.id=='sn'){S.name=($('#nm').value.replace(/[<>"&]/g,'').trim()||'Trader').slice(0,20);save();renderAc();$('#am').textContent='Name saved.'}
 else if(t.id=='lo')logout();
 else if(t.id=='li'){$('#ac').style.display='none';showGate('in')}
 else if(t.dataset.pw){const o=$('#op').value,nw=$('#np').value,am=$('#am');if(nw.length<6){am.textContent='New password must be at least 6 characters.';return}
  try{await unseal(await mkKey(o,ACC.name),LS('stockgpt:acct:'+ACC.uid))}catch(e){am.textContent='Current password is wrong.';return}
  ACC.key=await mkKey(nw,ACC.name);if(LS('stockgpt:sess')){try{localStorage.setItem('stockgpt:sess',JSON.stringify({name:ACC.name,uid:ACC.uid,jwk:await crypto.subtle.exportKey('jwk',ACC.key)}))}catch(e){}}
  await pushAcc();am.textContent='Password changed. Use the new one on your other devices.'}
 else if(t.dataset.th){S.th=t.dataset.th;save();applyTh();renderAc()}
 else if(t.dataset.rs){const k=t.dataset.rs;if(rsq!=k){rsq=k;t.textContent='Tap again to confirm';return}rsq='';
  if(k!='pay'){S.done=[];S.hd=[];S.xp=0;S.streak=0;S.last='';S.days=[];S.hr=5}
  if(k!='learn'){X={cash:1e5,pos:{}};saveX();paint()}
  if(k=='all')S.name='Trader';save();head();renderLearn();renderAc();$('#am').textContent='Done.'}};
applyTh();
function renderHist(){$('#hist').innerHTML=`<div class="mrow"><img class="mas" src="${WOLF}" alt="Wally the wolf"><div class="bub">Gather round, ${S.name}. These are real stories from market history, oldest first.</div></div>`+HX.map((e,i)=>`<div class="card"><div class="tag">${e.y}</div><h3>${e.n}</h3><p class="story2">${e.s}</p><button class="btn" data-h="${i}">${S.hd.includes(i)?'✅ Quiz again':'Take the quiz'}</button></div>`).join('')}
$('#hist').onclick=e=>{const b=e.target.closest('[data-h]');if(b)start(+b.dataset.h,'h')};
setInterval(()=>{head();if(S.hr>0)renderLearn()},60000);
renderHist();
/* ---------- accounts ---------- */
const te=new TextEncoder(),td=new TextDecoder(),defS=()=>({xp:0,done:[],streak:0,last:"",days:[],name:"Trader",hd:[],th:"auto",hr:5,hday:""});
const hx=b=>[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join(''),b64=u=>{let t='';u.forEach(c=>t+=String.fromCharCode(c));return btoa(t)},ub=t=>Uint8Array.from(atob(t),c=>c.charCodeAt(0));
const uidOf=async n=>hx(await crypto.subtle.digest('SHA-256',te.encode('stockgpt:'+n.toLowerCase()))).slice(0,32);
async function mkKey(pw,n){const m=await crypto.subtle.importKey('raw',te.encode(pw),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt:te.encode('stockgpt-salt:'+n.toLowerCase()),iterations:150000,hash:'SHA-256'},m,{name:'AES-GCM',length:256},true,['encrypt','decrypt'])}
async function seal(k,o){const iv=crypto.getRandomValues(new Uint8Array(12));return{iv:b64(iv),d:b64(new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},k,te.encode(JSON.stringify(o)))))}}
async function unseal(k,b){return JSON.parse(td.decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:ub(b.iv)},k,ub(b.d))))}
const LS=k=>{try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}};
const cloudP=new Promise(r=>{try{window.claude.use('db').then(d=>{cloud=d;r()},()=>r())}catch(e){r()}}),ready=()=>Promise.race([cloudP,new Promise(r=>setTimeout(r,4000))]);
cloudP.then(()=>{if($('#gst'))gateStatus();if(ACC)syncFromCloud()});
function syncTxt(){return !ACC?'':cloud?(ACC.cloud===false||ACC.cloudOff?'⚠️ Cloud save is off for this account, so progress is saved on this device only.':'☁️ Synced to the cloud. Log in from any device.'):'📱 Saved on this device only. Cloud sync is not available on this link.'}
function queueSync(){clearTimeout(syncT);syncT=setTimeout(pushAcc,1200)}
async function pushAcc(){if(!ACC)return;const b={...await seal(ACC.key,{S,X}),t:Date.now()};try{localStorage.setItem('stockgpt:acct:'+ACC.uid,JSON.stringify(b))}catch(e){}
 if(cloud&&!ACC.cloudOff){try{await cloud.doc('acct/'+ACC.uid).set(b);ACC.cloud=true}catch(e){ACC.cloud=false}}}
async function syncFromCloud(){if(!ACC||!cloud||ACC.cloudOff)return;try{const sn=await cloud.doc('acct/'+ACC.uid).get(),l=LS('stockgpt:acct:'+ACC.uid);
 if(!sn.exists){await pushAcc();return}const c=sn.data();let d;try{d=await unseal(ACC.key,c)}catch(e){ACC.cloudOff=1;return}
 if(!l||c.t>l.t){S=Object.assign(defS(),d.S);X=d.X||X;try{localStorage.setItem('stockgpt:acct:'+ACC.uid,JSON.stringify(c))}catch(e){}refreshAll()}else if(c.t<l.t)await pushAcc();else ACC.cloud=true}catch(e){}}
function refreshAll(){applyTh();renderLearn();renderHist();head();paint()}
let gmode='in',LN=localStorage.getItem('stockgpt:last')||'';
function gateStatus(){const e=$('#gst');if(e)e.textContent=cloud?'☁️ Cloud sync is on: log in from any device with your username and password.':'📱 On this link, accounts are saved on this device only. Open the accounts link to sync across devices.'}
function renderGate(err){$('#gate').innerHTML=`<div class="gw"><div class="hero"><img class="mas" src="${BULL}" alt="Bruno the bull"><img class="mas big" src="${WOLF}" alt="Wally the wolf"><img class="mas" src="${BEAR}" alt="Bella the bear"></div><h1 class="gh">stock<span>gpt</span></h1><p class="gsub">Learn stocks. Trade on paper. Become a wizard.</p>
<div class="gt"><button data-gm="in" class="${gmode=='in'?'on':''}">Log in</button><button data-gm="up" class="${gmode=='up'?'on':''}">Sign up</button></div>
<div class="gf"><label for="gu">Username</label><input id="gu" class="inp" autocomplete="username" maxlength="20" autocapitalize="none" value="${LN}"><label for="gp">Password</label><input id="gp" class="inp" type="password" autocomplete="${gmode=='in'?'current-password':'new-password'}">${gmode=='up'?'<label for="gp2">Confirm password</label><input id="gp2" class="inp" type="password" autocomplete="new-password">':''}<label class="gk"><input type="checkbox" id="gkeep" checked> Keep me signed in on this device</label></div>
<div class="gerr" id="ge">${err||''}</div><button class="btn" id="gok" style="width:100%">${gmode=='in'?'Log in':'Create account'}</button><button class="btn ghost" id="ggu" style="width:100%;margin-top:12px">Play as guest</button><p class="gs" id="gst"></p></div>`;gateStatus()}
function showGate(m){gmode=m||'in';$('#gate').style.display='block';renderGate()}
async function signup(n,pw){const uid=await uidOf(n);let c=null;if(cloud){try{const sn=await cloud.doc('acct/'+uid).get();if(sn.exists)c=1}catch(e){}}
 if(c||LS('stockgpt:acct:'+uid))return 'That username is already taken.';
 if(S.name=='Trader')S.name=n;ACC={name:n,uid,key:await mkKey(pw,n)};await pushAcc();return ''}
async function login(n,pw){const uid=await uidOf(n);let c=null;if(cloud){try{const sn=await cloud.doc('acct/'+uid).get();if(sn.exists)c=sn.data()}catch(e){}}
 const l=LS('stockgpt:acct:'+uid),b=c&&l?(c.t>=l.t?c:l):(c||l);if(!b)return 'No account found with that username.'+(cloud?'':' Accounts on this link are saved on this device only.');
 let key,d;try{key=await mkKey(pw,n);d=await unseal(key,b)}catch(e){return 'Wrong username or password.'}
 S=Object.assign(defS(),d.S);X=d.X||{cash:1e5,pos:{}};ACC={name:n,uid,key};await pushAcc();return ''}
async function enter(keep){$('#gate').style.display='none';try{localStorage.setItem('stockgpt:last',ACC.name);if(keep)localStorage.setItem('stockgpt:sess',JSON.stringify({name:ACC.name,uid:ACC.uid,jwk:await crypto.subtle.exportKey('jwk',ACC.key)}));else localStorage.removeItem('stockgpt:sess')}catch(e){}refreshAll();syncFromCloud()}
function logout(){try{localStorage.removeItem('stockgpt:sess')}catch(e){}clearTimeout(syncT);ACC=null;S=defS();X={cash:1e5,pos:{}};$('#ac').style.display='none';refreshAll();showGate('in')}
$('#gate').onclick=async e=>{const b=e.target.closest('button');if(!b)return;
 if(b.dataset.gm){LN=$('#gu').value.trim();gmode=b.dataset.gm;renderGate()}
 else if(b.id=='ggu')$('#gate').style.display='none';
 else if(b.id=='gok'){const n=$('#gu').value.trim(),pw=$('#gp').value,keep=$('#gkeep').checked;LN=n;
  if(!/^[A-Za-z0-9_]{3,20}$/.test(n))return renderGate('Username must be 3 to 20 letters, numbers or underscores.');
  if(pw.length<6)return renderGate('Password must be at least 6 characters.');
  if(gmode=='up'&&pw!=$('#gp2').value)return renderGate('The two passwords do not match.');
  b.disabled=true;b.textContent='Please wait…';await ready();
  const err=await(gmode=='up'?signup(n,pw):login(n,pw));if(err)return renderGate(err);await enter(keep)}};
addEventListener('pagehide',()=>{if(ACC)pushAcc()});
$('#gate').style.display='block';$('#gate').innerHTML='<div class="gw"><p class="gs" style="margin-top:40vh">Loading…</p></div>';
(async()=>{try{const ss=LS('stockgpt:sess');if(ss){const l=LS('stockgpt:acct:'+ss.uid),key=await crypto.subtle.importKey('jwk',ss.jwk,{name:'AES-GCM'},true,['encrypt','decrypt']),d=await unseal(key,l);
 S=Object.assign(defS(),d.S);X=d.X||{cash:1e5,pos:{}};ACC={name:ss.name,uid:ss.uid,key};$('#gate').style.display='none';refreshAll();await ready();syncFromCloud();return}}catch(e){}
 showGate('in')})();
document.addEventListener('keydown',e=>{if($('#ls').style.display!='flex'||e.target.tagName=='INPUT')return;
 if(e.key>='1'&&e.key<='3'){const o=document.querySelectorAll('.opt')[+e.key-1];if(o)o.click()}
 else if(e.key=='Enter'){const b=$('#chk:not([disabled])')||$('#nx')||$('#st')||$('#fin');if(b)b.click()}
 else if(e.key=='Escape')quit()});
renderLearn();head();
</script></body></html>
